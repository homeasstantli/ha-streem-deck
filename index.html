<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>HA Control Center</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#1c1c1e;
  --sheet:#2c2c2e;
  --tile:#3a3a3c;
  --tile-hover:#48484a;
  --tile-on:#ffffff;
  --tile-on-text:#1c1c1e;
  --text:#ffffff;
  --text2:rgba(255,255,255,0.55);
  --text3:rgba(255,255,255,0.3);
  --border:rgba(255,255,255,0.08);
  --border2:rgba(255,255,255,0.15);
  --green:#30d158;
  --blue:#0a84ff;
  --radius:18px;
  --radius-sm:12px;
  --radius-xs:8px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;}
#setup{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem;}
.setup-card{background:var(--sheet);border-radius:var(--radius);padding:2rem;width:100%;max-width:360px;}
.setup-card h1{font-size:22px;font-weight:700;margin-bottom:4px;}
.setup-card p{font-size:14px;color:var(--text2);margin-bottom:1.5rem;line-height:1.5;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
.field input{width:100%;padding:11px 14px;font-size:15px;background:rgba(255,255,255,0.07);border:0.5px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);outline:none;}
.field input::placeholder{color:var(--text3);}
.field input:focus{border-color:var(--blue);}
.connect-btn{width:100%;padding:13px;font-size:16px;font-weight:600;background:var(--blue);color:#fff;border:none;border-radius:var(--radius-sm);cursor:pointer;margin-top:4px;}
.connect-btn:disabled{opacity:.4;cursor:not-allowed;}
.err{font-size:13px;color:#ff453a;margin-top:10px;display:none;line-height:1.4;}
#app{display:none;min-height:100vh;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 8px;}
.topbar-left .time{font-size:28px;font-weight:700;line-height:1.1;}
.topbar-right{display:flex;gap:8px;}
.top-btn{background:rgba(255,255,255,0.08);border:none;border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--text);font-size:18px;display:flex;align-items:center;justify-content:center;}
.top-btn:hover{background:rgba(255,255,255,0.14);}
.top-btn.editing{background:var(--blue);color:#fff;}
.grid-area{padding:8px 16px 20px;}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px;}
.tile{background:var(--tile);border-radius:var(--radius);padding:14px 12px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;min-height:90px;position:relative;transition:background .15s,transform .1s;user-select:none;-webkit-user-select:none;overflow:visible;}
.tile:active{transform:scale(.93);}
.tile:hover{background:var(--tile-hover);}
.tile.on{background:var(--tile-on);}
.tile.on .tile-icon,.tile.on .tile-name,.tile.on .tile-state{color:var(--tile-on-text);}
.tile.on:hover{background:#e8e8e8;}
.tile.wide{grid-column:span 2;flex-direction:row;align-items:center;gap:12px;min-height:76px;}
.tile.wide .tile-body{flex:1;min-width:0;}
.tile-icon{font-size:22px;color:var(--text2);margin-bottom:8px;line-height:1;}
.tile.wide .tile-icon{margin-bottom:0;font-size:24px;flex-shrink:0;}
.tile-name{font-size:11px;font-weight:600;color:var(--text);line-height:1.2;margin-bottom:2px;}
.tile-state{font-size:10px;color:var(--text2);}
.media-btns{display:flex;gap:4px;margin-top:6px;}
.media-btn{background:rgba(255,255,255,0.12);border:none;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:14px;color:var(--text);line-height:1;}
.tile.on .media-btn{background:rgba(0,0,0,0.1);color:var(--tile-on-text);}
.media-btn:hover{background:rgba(255,255,255,0.2);}
.cover-btns{display:flex;gap:4px;margin-top:6px;}
.cover-btn{background:rgba(255,255,255,0.12);border:none;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px;color:var(--text);}
.tile.on .cover-btn{background:rgba(0,0,0,0.1);color:var(--tile-on-text);}
@keyframes wobble{0%,100%{transform:rotate(-1.5deg);}50%{transform:rotate(1.5deg);}}
.tile.editing-mode{animation:wobble .45s ease-in-out infinite;}
.remove-badge{display:none;position:absolute;top:-8px;left:-8px;width:26px;height:26px;background:#ff453a;border-radius:50%;border:2.5px solid var(--bg);cursor:pointer;align-items:center;justify-content:center;font-size:16px;color:#fff;font-weight:700;z-index:20;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.4);}
.editing-mode .remove-badge{display:flex;}
.tile.add-tile{border:1.5px dashed var(--border2);background:transparent;align-items:center;justify-content:center;cursor:pointer;animation:none !important;}
.tile.add-tile:hover{background:rgba(255,255,255,0.04);}
.tile.add-tile i{font-size:28px;color:var(--text3);}
.tile.drag-over{outline:2px solid var(--blue);}
.status-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);padding:4px 10px;background:rgba(255,255,255,0.06);border-radius:20px;margin:0 16px 4px;}
.sdot{width:5px;height:5px;border-radius:50%;background:var(--green);}
.sdot.off{background:#ff453a;}
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:flex-end;}
.sheet-overlay.open{display:flex;}
.sheet{background:var(--sheet);border-radius:var(--radius) var(--radius) 0 0;width:100%;max-height:80vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0);}
.sheet-handle{width:36px;height:4px;background:rgba(255,255,255,0.2);border-radius:2px;margin:10px auto 0;}
.sheet-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 10px;}
.sheet-header h2{font-size:17px;font-weight:700;}
.sheet-close{background:rgba(255,255,255,0.1);border:none;border-radius:50%;width:30px;height:30px;cursor:pointer;color:var(--text);font-size:16px;display:flex;align-items:center;justify-content:center;}
.sheet-search{padding:0 16px 12px;}
.sheet-search input{width:100%;padding:10px 14px;background:rgba(255,255,255,0.07);border:0.5px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:15px;outline:none;}
.sheet-search input::placeholder{color:var(--text3);}
.entity-list{overflow-y:auto;flex:1;padding:0 12px 16px;}
.entity-row{display:flex;align-items:center;padding:10px;border-radius:var(--radius-sm);cursor:pointer;gap:12px;}
.entity-row:hover{background:rgba(255,255,255,0.06);}
.entity-row.added{opacity:.35;pointer-events:none;}
.entity-icon{font-size:20px;color:var(--text2);width:24px;text-align:center;flex-shrink:0;}
.entity-info{flex:1;min-width:0;}
.entity-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.entity-id{font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.entity-add{background:var(--blue);border:none;border-radius:50%;width:28px;height:28px;cursor:pointer;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.entity-type-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;padding:10px 10px 4px;}
</style>
</head>
<body>

<div id="setup">
  <div class="setup-card">
    <h1>Control Center</h1>
    <p>Connect to your local Home Assistant to get started.</p>
    <div class="field"><label>Home Assistant URL</label><input type="text" id="ha-url" placeholder="http://homeassistant.local:8123" /></div>
    <div class="field"><label>Access Token</label><input type="password" id="ha-token" placeholder="eyJ…" /></div>
    <button class="connect-btn" id="connect-btn" onclick="connect()">Connect</button>
    <div class="err" id="err-msg"></div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="topbar-left">
      <div class="time" id="clock"></div>
      <div style="font-size:12px;color:var(--text2);margin-top:2px;" id="date-str"></div>
    </div>
    <div class="topbar-right">
      <button class="top-btn" id="edit-btn" onclick="toggleEdit()" title="Customize"><i class="ti ti-layout-grid-add"></i></button>
      <button class="top-btn" onclick="refreshAll()" title="Refresh"><i class="ti ti-refresh"></i></button>
      <button class="top-btn" onclick="disconnectHA()" title="Disconnect"><i class="ti ti-plug-x"></i></button>
    </div>
  </div>
  <div class="status-pill"><div class="sdot" id="sdot"></div><span id="stext">Connected</span></div>
  <div class="grid-area">
    <div class="grid" id="main-grid"></div>
  </div>
</div>

<div class="sheet-overlay" id="sheet-overlay" onclick="closeSheetOutside(event)">
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h2>Add a tile</h2>
      <button class="sheet-close" onclick="closeSheet()"><i class="ti ti-x"></i></button>
    </div>
    <div class="sheet-search"><input type="text" id="sheet-search" placeholder="Search entities…" oninput="filterEntities(this.value)" /></div>
    <div class="entity-list" id="entity-list"></div>
  </div>
</div>

<script>
let HA_URL='', HA_TOKEN='', stateCache={}, tiles=[], allEntities=[], editMode=false, dragSrc=null;
const STORAGE_KEY='ha-deck-tiles';
const CONN_KEY='ha-deck-conn';

function ha(path,opts={}){
  return fetch(HA_URL+'/api'+path,{...opts,headers:{'Authorization':'Bearer '+HA_TOKEN,'Content-Type':'application/json',...(opts.headers||{})}});
}

function tick(){
  const n=new Date();
  let h=n.getHours();const ampm=h>=12?'PM':'AM';h=h%12||12;
  const m=String(n.getMinutes()).padStart(2,'0');
  document.getElementById('clock').textContent=h+':'+m+' '+ampm;
  const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('date-str').textContent=days[n.getDay()]+', '+months[n.getMonth()]+' '+n.getDate();
}
tick(); setInterval(tick,10000);

async function connect(){
  const url=document.getElementById('ha-url').value.trim().replace(/\/$/,'');
  const token=document.getElementById('ha-token').value.trim();
  const btn=document.getElementById('connect-btn');
  const err=document.getElementById('err-msg');
  if(!url||!token){showErr('Please fill in both fields.');return;}
  btn.disabled=true;btn.textContent='Connecting…';err.style.display='none';
  HA_URL=url;HA_TOKEN=token;
  try{
    const r=await ha('/');if(!r.ok)throw new Error();await r.json();
    localStorage.setItem(CONN_KEY,JSON.stringify({url,token}));
    document.getElementById('setup').style.display='none';
    document.getElementById('app').style.display='block';
    await loadEntities();
    loadSavedTiles();
    renderGrid();
  }catch(e){
    HA_URL='';HA_TOKEN='';
    showErr('Could not connect. Check your URL and token, and make sure cors_allowed_origins includes this site in configuration.yaml.');
    btn.disabled=false;btn.textContent='Connect';
  }
}
function showErr(m){const e=document.getElementById('err-msg');e.textContent=m;e.style.display='block';}

function disconnectHA(){
  HA_URL='';HA_TOKEN='';stateCache={};tiles=[];
  localStorage.removeItem(CONN_KEY);
  document.getElementById('app').style.display='none';
  document.getElementById('setup').style.display='flex';
  document.getElementById('connect-btn').disabled=false;
  document.getElementById('connect-btn').textContent='Connect';
}

window.addEventListener('DOMContentLoaded',()=>{
  const saved=localStorage.getItem(CONN_KEY);
  if(saved){
    try{
      const {url,token}=JSON.parse(saved);
      document.getElementById('ha-url').value=url;
      document.getElementById('ha-token').value=token;
      HA_URL=url;HA_TOKEN=token;
      document.getElementById('setup').style.display='none';
      document.getElementById('app').style.display='block';
      loadEntities().then(()=>{loadSavedTiles();renderGrid();});
    }catch(e){}
  }
});

async function loadEntities(){
  try{
    const r=await ha('/states');if(!r.ok)throw new Error();
    const states=await r.json();
    stateCache={};
    states.forEach(s=>stateCache[s.entity_id]=s);
    allEntities=states.filter(s=>{
      const d=s.entity_id.split('.')[0];
      return ['light','switch','cover','media_player','scene','script','input_boolean','fan','climate','lock'].includes(d);
    }).sort((a,b)=>fname(a).localeCompare(fname(b)));
    setStatus(true);
  }catch(e){setStatus(false);}
}

function setStatus(ok){
  document.getElementById('sdot').className='sdot'+(ok?'':' off');
  document.getElementById('stext').textContent=ok?'Connected':'Connection lost';
}

async function refreshAll(){await loadEntities();renderGrid();}
function fname(s){return s.attributes.friendly_name||s.entity_id.split('.')[1].replace(/_/g,' ');}
function saveTiles(){localStorage.setItem(STORAGE_KEY,JSON.stringify(tiles));}
function loadSavedTiles(){
  const saved=localStorage.getItem(STORAGE_KEY);
  if(saved){try{tiles=JSON.parse(saved);}catch(e){tiles=[];}}
  else{tiles=allEntities.slice(0,8).map(s=>s.entity_id);}
}

function domainIcon(eid){
  const d=eid.split('.')[0];const n=eid.toLowerCase();
  if(d==='light'){
    if(n.includes('lamp'))return'ti-lamp';
    if(n.includes('strip')||n.includes('led'))return'ti-rectangle';
    if(n.includes('night'))return'ti-moon';
    return'ti-bulb';
  }
  if(d==='switch')return'ti-toggle-right';
  if(d==='cover')return'ti-layout-bottombar';
  if(d==='media_player')return'ti-device-speaker';
  if(d==='scene')return'ti-sparkles';
  if(d==='script')return'ti-player-play';
  if(d==='input_boolean')return'ti-toggle-right';
  if(d==='fan')return'ti-propeller';
  if(d==='climate')return'ti-temperature';
  if(d==='lock')return'ti-lock';
  return'ti-device-desktop';
}

function isWide(eid){return eid.split('.')[0]==='media_player';}
function isOn(s){return s&&['on','open','playing','unlocked','heat','cool','auto','fan_only'].includes(s.state);}

function renderGrid(){
  const g=document.getElementById('main-grid');
  g.innerHTML='';
  tiles.forEach((eid,idx)=>{
    const s=stateCache[eid];
    if(!s)return;
    const d=eid.split('.')[0];
    const wide=isWide(eid);
    const on=isOn(s);
    const div=document.createElement('div');
    div.className='tile'+(wide?' wide':'')+(on?' on':'')+(editMode?' editing-mode':'');
    div.dataset.eid=eid;
    div.dataset.idx=idx;
    div.draggable=true;

    const rb=document.createElement('div');
    rb.className='remove-badge';rb.innerHTML='−';
    rb.onclick=(e)=>{e.stopPropagation();removeTile(idx);};
    div.appendChild(rb);

    if(d==='media_player'){
      const track=s.attributes.media_title||'';
      const artist=s.attributes.media_artist||'';
      const stateLabel=s.state==='playing'?(track||(artist?artist:'Playing')):s.state.charAt(0).toUpperCase()+s.state.slice(1);
      div.innerHTML+=`<i class="ti ${domainIcon(eid)} tile-icon"></i>
      <div class="tile-body">
        <div class="tile-name">${fname(s)}</div>
        <div class="tile-state" id="ms-${eid}">${stateLabel}</div>
        <div class="media-btns">
          <button class="media-btn" onclick="mCmd(event,'${eid}','media_previous_track')"><i class="ti ti-player-skip-back"></i></button>
          <button class="media-btn" id="mplay-${eid}" onclick="mCmd(event,'${eid}','${s.state==='playing'?'media_pause':'media_play'}')"><i class="ti ${s.state==='playing'?'ti-player-pause':'ti-player-play'}"></i></button>
          <button class="media-btn" onclick="mCmd(event,'${eid}','media_next_track')"><i class="ti ti-player-skip-forward"></i></button>
          <button class="media-btn" onclick="mCmd(event,'${eid}','volume_down')"><i class="ti ti-volume-3"></i></button>
          <button class="media-btn" onclick="mCmd(event,'${eid}','volume_up')"><i class="ti ti-volume"></i></button>
        </div>
      </div>`;
      div.onclick=null;
    } else if(d==='cover'){
      const pos=s.attributes.current_position!=null?s.attributes.current_position+'%':s.state;
      div.innerHTML+=`<i class="ti ${domainIcon(eid)} tile-icon"></i>
      <div class="tile-name">${fname(s)}</div>
      <div class="tile-state" id="cs-${eid}">${pos}</div>
      <div class="cover-btns">
        <button class="cover-btn" onclick="cvCmd(event,'${eid}','open')"><i class="ti ti-arrow-up"></i></button>
        <button class="cover-btn" onclick="cvCmd(event,'${eid}','stop')"><i class="ti ti-square"></i></button>
        <button class="cover-btn" onclick="cvCmd(event,'${eid}','close')"><i class="ti ti-arrow-down"></i></button>
      </div>`;
      div.onclick=null;
    } else if(d==='scene'||d==='script'){
      div.innerHTML+=`<i class="ti ${domainIcon(eid)} tile-icon"></i>
      <div class="tile-name">${fname(s)}</div>
      <div class="tile-state">Tap to run</div>`;
      div.onclick=()=>{if(!editMode)activateScene(eid,div);};
    } else {
      div.innerHTML+=`<i class="ti ${domainIcon(eid)} tile-icon"></i>
      <div class="tile-name">${fname(s)}</div>
      <div class="tile-state">${on?'On':'Off'}</div>`;
      div.onclick=()=>{if(!editMode)toggleEntity(eid,d,div);};
    }

    div.addEventListener('dragstart',e=>{dragSrc=idx;e.dataTransfer.effectAllowed='move';div.style.opacity='.4';});
    div.addEventListener('dragend',()=>{div.style.opacity='';document.querySelectorAll('.tile.drag-over').forEach(t=>t.classList.remove('drag-over'));});
    div.addEventListener('dragover',e=>{e.preventDefault();div.classList.add('drag-over');});
    div.addEventListener('dragleave',()=>div.classList.remove('drag-over'));
    div.addEventListener('drop',e=>{
      e.preventDefault();div.classList.remove('drag-over');
      if(dragSrc===null||dragSrc===idx)return;
      const moved=tiles.splice(dragSrc,1)[0];
      tiles.splice(idx,0,moved);
      saveTiles();renderGrid();dragSrc=null;
    });

    g.appendChild(div);
  });

  if(editMode){
    const add=document.createElement('div');
    add.className='tile add-tile';
    add.innerHTML='<i class="ti ti-plus"></i>';
    add.onclick=openSheet;
    g.appendChild(add);
  }
}

async function toggleEntity(eid,domain,tile){
  tile.style.opacity='.5';tile.style.pointerEvents='none';
  const on=tile.classList.contains('on');
  const svc=on?'turn_off':'turn_on';
  const dom=['light','switch','input_boolean','fan'].includes(domain)?domain:'homeassistant';
  try{
    await ha('/services/'+dom+'/'+svc,{method:'POST',body:JSON.stringify({entity_id:eid})});
    tile.classList.toggle('on');
    const st=tile.querySelector('.tile-state');if(st)st.textContent=on?'Off':'On';
  }catch(e){}
  tile.style.opacity='';tile.style.pointerEvents='';
}

async function mCmd(e,eid,svc){
  e.stopPropagation();
  try{await ha('/services/media_player/'+svc,{method:'POST',body:JSON.stringify({entity_id:eid})});}catch(e){}
  setTimeout(()=>refreshEntity(eid),600);
}

async function cvCmd(e,eid,cmd){
  e.stopPropagation();
  const svc={open:'open_cover',close:'close_cover',stop:'stop_cover'}[cmd];
  try{
    await ha('/services/cover/'+svc,{method:'POST',body:JSON.stringify({entity_id:eid})});
    const el=document.getElementById('cs-'+eid);
    if(el)el.textContent=cmd==='open'?'Opening…':cmd==='close'?'Closing…':'Stopped';
  }catch(e){}
}

async function activateScene(eid,tile){
  tile.style.opacity='.5';
  const d=eid.split('.')[0];
  const dom=d==='script'?'script':'scene';
  try{await ha('/services/'+dom+'/turn_on',{method:'POST',body:JSON.stringify({entity_id:eid})});}catch(e){}
  tile.querySelector('.tile-state').textContent='Done ✓';
  setTimeout(()=>{tile.querySelector('.tile-state').textContent='Tap to run';tile.style.opacity='';},1800);
}

async function refreshEntity(eid){
  try{
    const r=await ha('/states/'+eid);const s=await r.json();stateCache[eid]=s;
    const playing=s.state==='playing';
    const track=s.attributes.media_title||'';const artist=s.attributes.media_artist||'';
    const label=playing?(track||(artist||'Playing')):s.state.charAt(0).toUpperCase()+s.state.slice(1);
    const st=document.getElementById('ms-'+eid);if(st)st.textContent=label;
    const pb=document.getElementById('mplay-'+eid);
    if(pb){pb.innerHTML=`<i class="ti ${playing?'ti-player-pause':'ti-player-play'}"></i>`;pb.onclick=e=>mCmd(e,eid,playing?'media_pause':'media_play');}
  }catch(e){}
}

function toggleEdit(){
  editMode=!editMode;
  document.getElementById('edit-btn').classList.toggle('editing',editMode);
  renderGrid();
}

function removeTile(idx){tiles.splice(idx,1);saveTiles();renderGrid();}

function openSheet(){
  renderEntityList('');
  document.getElementById('sheet-search').value='';
  document.getElementById('sheet-overlay').classList.add('open');
}
function closeSheet(){document.getElementById('sheet-overlay').classList.remove('open');}
function closeSheetOutside(e){if(e.target===document.getElementById('sheet-overlay'))closeSheet();}

function domainLabel(d){
  return{light:'Lights',switch:'Switches',cover:'Covers',media_player:'Media',scene:'Scenes',script:'Scripts',input_boolean:'Toggles',fan:'Fans',climate:'Climate',lock:'Locks'}[d]||d;
}

function renderEntityList(query){
  const list=document.getElementById('entity-list');
  const q=query.toLowerCase();
  const filtered=allEntities.filter(s=>!q||(fname(s).toLowerCase().includes(q)||s.entity_id.includes(q)));
  if(!filtered.length){list.innerHTML='<div style="text-align:center;padding:2rem;color:var(--text3);font-size:14px;">No entities found</div>';return;}
  const groups={};
  filtered.forEach(s=>{const d=s.entity_id.split('.')[0];if(!groups[d])groups[d]=[];groups[d].push(s);});
  list.innerHTML=Object.entries(groups).map(([d,ents])=>`
    <div class="entity-type-label">${domainLabel(d)}</div>
    ${ents.map(s=>{
      const added=tiles.includes(s.entity_id);
      return `<div class="entity-row${added?' added':''}" id="erow-${s.entity_id.replace('.','_')}">
        <i class="ti ${domainIcon(s.entity_id)} entity-icon"></i>
        <div class="entity-info">
          <div class="entity-name">${fname(s)}</div>
          <div class="entity-id">${s.entity_id}</div>
        </div>
        ${added?'<i class="ti ti-check" style="color:var(--text3);font-size:16px;"></i>':'<button class="entity-add" onclick="addTile(\''+s.entity_id+'\')"><i class="ti ti-plus"></i></button>'}
      </div>`;
    }).join('')}
  `).join('');
}

function filterEntities(q){renderEntityList(q);}

function addTile(eid){
  if(!tiles.includes(eid)){tiles.push(eid);saveTiles();}
  renderGrid();
  const row=document.getElementById('erow-'+eid.replace('.','_'));
  if(row)row.classList.add('added');
}

document.getElementById('ha-token').addEventListener('keydown',e=>{if(e.key==='Enter')connect();});
document.getElementById('ha-url').addEventListener('keydown',e=>{if(e.key==='Enter')connect();});
</script>
</body>
</html>
